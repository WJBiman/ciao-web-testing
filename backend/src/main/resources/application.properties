spring.application.name=backend

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/ciao_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.data-source-properties.connectTimeout=5000
spring.datasource.hikari.data-source-properties.socketTimeout=10000

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server Port
server.port=8080

# JWT & Security Configuration (Production Hardening: override CIAO_JWT_SECRET in production environment)
ciao.app.jwtSecret=${CIAO_JWT_SECRET:mySuperSecretKeyForCiaoApplicationWhichNeedsToBeAtLeast32Bytes}
ciao.app.jwtExpirationMs=86400000
ciao.app.jwtCookieName=ciao_jwt
ciao.app.cookieSecure=${CIAO_COOKIE_SECURE:false}

# Jackson Configuration
spring.jackson.serialization.fail-on-empty-beans=false
